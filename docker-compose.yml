# MedVault local development services. NOT for production (dev passwords).
services:
  postgres:
    image: postgres:16
    container_name: medvault-db
    environment:
      POSTGRES_DB: medvault
      POSTGRES_USER: medvault
      POSTGRES_PASSWORD: medvault_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # lets you run the SQL files from inside the container on any OS
      - ./backend/src/main/resources/db/migration:/migrations:ro
      - ./docs/sql:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvault -d medvault"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: medvault-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: medvault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
